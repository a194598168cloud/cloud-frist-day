
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12 生肖轮盘抽奖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }

        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #wheelCanvas {
            display: block;
            border-radius: 50%;
            cursor: pointer;
            transition: filter 0.3s ease;
        }

        #wheelCanvas:hover {
            filter: brightness(1.05);
        }

        #wheelCanvas.spinning {
            cursor: not-allowed;
        }

        .pointer {
            position: absolute;
            top: -25px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #667eea;
            z-index: 10;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.2));
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .spin-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-width: 150px;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .reset-btn {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .reset-btn:hover {
            background: #e0e0e0;
            border-color: #999;
            transform: translateY(-2px);
        }

        .record-section {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 25px;
        }

        .record-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.4em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .record-section h2::before {
            content: '🏆';
            font-size: 1.3em;
        }

        .record-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            min-height: 200px;
            max-height: 300px;
            overflow-y: auto;
            padding: 15px;
            background: white;
            border-radius: 15px;
            border: 1px solid #e0e0e0;
        }

        .record-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: slideIn 0.3s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .record-item-number {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85em;
        }

        .empty-message {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 1em;
        }

        .record-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: white;
            border-radius: 15px;
            border: 1px solid #e0e0e0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .completion-message {
            margin-top: 15px;
            padding: 15px;
            background: #ffe5e5;
            color: #d32f2f;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            border-left: 4px solid #d32f2f;
            display: none;
        }

        .completion-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .result-modal.show {
            display: flex;
        }

        .result-content {
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: popIn 0.4s ease;
            max-width: 400px;
        }

        .result-emoji {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .result-text {
            font-size: 2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-close-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 40px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 auto;
        }

        .result-close-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.7);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .wheel-container {
                width: 300px;
                height: 300px;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎡 生肖轮盘抽奖</h1>
            <p>转动轮盘，开启好运之门</p>
        </div>

        <div class="main-content">
            <div class="wheel-section">
                <div class="wheel-container">
                    <canvas id="wheelCanvas" width="400" height="400"></canvas>
                    <div class="pointer"></div>
                </div>

                <div class="controls">
                    <button class="spin-btn" id="spinBtn">开始转动</button>
                    <button class="reset-btn" id="resetBtn">🔄 重新开始</button>
                </div>
            </div>

            <div class="record-section">
                <h2>中奖记录</h2>
                <div class="record-list" id="recordList">
                    <div class="empty-message">等待转动轮盘...</div>
                </div>

                <div class="record-stats">
                    <div class="stat-item">
                        <div class="stat-label">已抽取</div>
                        <div class="stat-value"><span id="drawnCount">0</span>/12</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">剩余</div>
                        <div class="stat-value"><span id="remainCount">12</span></div>
                    </div>
                </div>

                <div class="completion-message" id="completionMsg">
                    ✨ 已全部抽完！点击"重新开始"开启新一轮 ✨
                </div>
            </div>
        </div>
    </div>

    <div class="result-modal" id="resultModal">
        <div class="result-content">
            <div class="result-emoji" id="resultEmoji"></div>
            <div class="result-text" id="resultText"></div>
            <button class="result-close-btn" id="closeResultBtn">确定</button>
        </div>
    </div>

    <script>
        // 生肖数据
        const zodiacData = [
            { name: '鼠', emoji: '🐭', color: '#FF6B6B' },
            { name: '牛', emoji: '🐂', color: '#4ECDC4' },
            { name: '虎', emoji: '🐯', color: '#FFE66D' },
            { name: '兔', emoji: '🐰', color: '#95E1D3' },
            { name: '龙', emoji: '🐉', color: '#F38181' },
            { name: '蛇', emoji: '🐍', color: '#AA96DA' },
            { name: '马', emoji: '🐴', color: '#FCBAD3' },
            { name: '羊', emoji: '🐑', color: '#FFFFD2' },
            { name: '猴', emoji: '🐵', color: '#FFCBA4' },
            { name: '鸡', emoji: '🐔', color: '#FF9FF3' },
            { name: '狗', emoji: '🐕', color: '#A8E6CF' },
            { name: '猪', emoji: '🐷', color: '#FFD3B6' }
        ];

        // 全局变量
        let drawnZodiacs = [];
        let isSpinning = false;
        let currentRotation = 0;
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        // 初始化
        function init() {
            drawWheel();
            setupEventListeners();
        }

        // 绘制轮盘
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 180;
            const sliceAngle = (2 * Math.PI) / 12;

            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制12个扇形
            zodiacData.forEach((zodiac, index) => {
                const startAngle = index * sliceAngle - Math.PI / 2 + currentRotation;
                const endAngle = startAngle + sliceAngle;

                // 判断是否已被抽中
                const isDrawn = drawnZodiacs.includes(index);
                
                // 绘制扇形
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();

                // 填充颜色
                if (isDrawn) {
                    ctx.fillStyle = '#E0E0E0';
                    ctx.globalAlpha = 0.6;
                } else {
                    ctx.fillStyle = zodiac.color;
                    ctx.globalAlpha = 1;
                }
                ctx.fill();

                // 边框
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.globalAlpha = 1;

                // 绘制文字
                const textAngle = startAngle + sliceAngle / 2;
                const textRadius = radius * 0.65;
                const textX = centerX + Math.cos(textAngle) * textRadius;
                const textY = centerY + Math.sin(textAngle) * textRadius;

                ctx.save();
                ctx.translate(textX, textY);
                ctx.rotate(textAngle + Math.PI / 2);
                ctx.fillStyle = isDrawn ? '#999' : 'white';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(zodiac.emoji, 0, 0);
                ctx.font = 'bold 14px Arial';
                ctx.fillText(zodiac.name, 0, 28);
                ctx.restore();
            });

            // 绘制中心圆
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = '#667eea';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('转', centerX, centerY);
        }

        // 转动轮盘
        function spin() {
            if (isSpinning || drawnZodiacs.length === 12) return;

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            const remainingCount = 12 - drawnZodiacs.length;
            const randomZodiacIndex = Math.floor(Math.random() * remainingCount);
            
            // 获取未被抽中的生肖
            const availableIndices = [];
            for (let i = 0; i < 12; i++) {
                if (!drawnZodiacs.includes(i)) {
                    availableIndices.push(i);
                }
            }
            
            const selectedIndex = availableIndices[randomZodiacIndex];
            const targetAngle = (selectedIndex * (360 / 12)) + 180;

            let currentAngle = (currentRotation * 180 / Math.PI) % 360;
            let rounds = 5 + Math.random() * 3; // 转5-8圈
            let totalRotation = rounds * 360 + (targetAngle - currentAngle);

            animateSpin(0, totalRotation, selectedIndex);
        }

        // 旋转动画
        function animateSpin(currentDegree, targetDegree, selectedIndex) {
            const duration = 3000; // 3秒
            const startTime = Date.now();

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // 缓出动画（ease-out）
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                const currentRotationDegree = currentDegree + (targetDegree - currentDegree) * easeProgress;

                currentRotation = (currentRotationDegree * Math.PI / 180) % (2 * Math.PI);
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    finishSpin(selectedIndex);
                }
            }

            requestAnimationFrame(animate);
        }

        // 完成转动
        function finishSpin(selectedIndex) {
            // 添加到已抽中列表
            drawnZodiacs.push(selectedIndex);

            // 显示结果弹窗
            showResult(selectedIndex);

            // 更新记录和统计
            updateRecords();

            // 重新绘制轮盘
            drawWheel();

            isSpinning = false;
            document.getElementById('spinBtn').disabled = drawnZodiacs.length === 12;
        }

        // 显示结果弹窗
        function showResult(selectedIndex) {
            const zodiac = zodiacData[selectedIndex];
            document.getElementById('resultEmoji').textContent = zodiac.emoji;
            document.getElementById('resultText').textContent = '恭喜你获得：' + zodiac.name;
            document.getElementById('resultModal').classList.add('show');
        }

        // 关闭结果弹窗
        function closeResult() {
            document.getElementById('resultModal').classList.remove('show');
        }

        // 更新记录
        function updateRecords() {
            const recordList = document.getElementById('recordList');
            recordList.innerHTML = '';

            if (drawnZodiacs.length === 0) {
                recordList.innerHTML = '<div class="empty-message">等待转动轮盘...</div>';
            } else {
                drawnZodiacs.forEach((index, position) => {
                    const zodiac = zodiacData[index];
                    const recordItem = document.createElement('div');
                    recordItem.className = 'record-item';
                    recordItem.innerHTML = `
                        <div class="record-item-number">${position + 1}</div>
                        <span>${zodiac.emoji} ${zodiac.name}</span>
                    `;
                    recordList.appendChild(recordItem);
                });
            }

            // 更新统计
            document.getElementById('drawnCount').textContent = drawnZodiacs.length;
            document.getElementById('remainCount').textContent = 12 - drawnZodiacs.length;

            // 显示完成提示
            const completionMsg = document.getElementById('completionMsg');
            if (drawnZodiacs.length === 12) {
                completionMsg.classList.add('show');
                document.getElementById('spinBtn').disabled = true;
            } else {
                completionMsg.classList.remove('show');
            }
        }

        // 重置
        function reset() {
            drawnZodiacs = [];
            isSpinning = false;
            currentRotation = 0;
            document.getElementById('spinBtn').disabled = false;
            document.getElementById('resultModal').classList.remove('show');
            updateRecords();
            drawWheel();
        }

        // 事件监听
        function setupEventListeners() {
            document.getElementById('spinBtn').addEventListener('click', spin);
            document.getElementById('resetBtn').addEventListener('click', reset);
            document.getElementById('closeResultBtn').addEventListener('click', closeResult);
            document.getElementById('resultModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeResult();
                }
            });
        }

        // 启动
        init();
    </script>
</body>
</html>
